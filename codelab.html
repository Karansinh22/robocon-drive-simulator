<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code Lab – Robocon Drive Simulator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231d4ed8'/%3E%3Cpath d='M12 10l-6 6 6 6M20 10l6 6-6 6' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E" />
</head>
<body class="lab-page">
  <div id="lab">
    <header id="topbar"></header>
    <div id="loadBar" hidden></div>
    <main id="labMain">
      <section id="left">
        <div id="editorBar"></div>
        <div id="exerciseBox" hidden></div>
        <div id="errorBanner" hidden></div>
        <div id="warnBadge" hidden></div>
        <div id="editor"></div>
        <div id="bottom">
          <div id="tabBar"></div>
          <div id="tabBody"></div>
        </div>
      </section>
      <section id="view">
        <canvas id="scene"></canvas>
        <div id="readout" aria-live="off"></div>
        <div id="camBar"></div>
        <div id="viewToggles"></div>
        <div id="padsLeft" class="dock dock-left"></div>
        <div id="padsRight" class="dock dock-right"></div>
      </section>
    </main>
  </div>
  <script type="module" src="/src/codelab/main.js"></script>
</body>
</html>
